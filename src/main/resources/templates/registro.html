
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">
<title>Registro | MENOSS</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

header {
    background: white;
    padding: 15px 8%;
    box-shadow: 0 2px 8px #00000015;
}

header img {
    width: 145px;
}

.contenedor {
    max-width: 430px;
    margin: 60px auto;
    background: white;
    padding: 35px;
    border-radius: 14px;
    box-shadow: 0 4px 20px #00000012;
}

h1 {
    text-align: center;
    color: #e30613;
}

p {
    text-align: center;
    color: #666;
}

label {
    display: block;
    margin: 18px 0 7px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 7px;
}

button {
    width: 100%;
    background: #e30613;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 25px;
}

button:hover {
    background: #b80010;
}

.mensaje {
    margin-top: 20px;
    padding: 12px;
    background: #f1f1f1;
    border-radius: 7px;
    text-align: center;
}

.volver {
    display: block;
    margin-top: 20px;
    text-align: center;
    color: #e30613;
    text-decoration: none;
}
</style>
</head>

<body>

<header>
    <a href="/">
        <img src="/img/logo.png" alt="MENOSS">
    </a>
</header>

<main class="contenedor">
    <h1>Crear una cuenta</h1>
    <p>Regístrate y empieza a comprar en MENOSS</p>

    <form action="/registro" method="post">

        <label for="nombre">Nombre completo</label>
        <input type="text"
               id="nombre"
               name="nombre"
               required>

        <label for="correo">Correo electrónico</label>
        <input type="email"
               id="correo"
               name="correo"
               required>

        <label for="password">Contraseña</label>
        <input type="password"
               id="password"
               name="password"
               minlength="8"
               required>

        <button type="submit" id="registrar">
            Registrarme
        </button>
    </form>

    <div id="mensaje"
         class="mensaje"
         role="status"
         th:if="${mensaje != null}"
         th:text="${mensaje}">
    </div>

    <a href="/" class="volver">
        ← Volver al inicio
    </a>
</main>

</body>
</html>
