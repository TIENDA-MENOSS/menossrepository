
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Confirmar pedido | MENOSS</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #252525;
}

header {
    background: white;
    padding: 15px 8%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px #00000015;
}

header img {
    width: 145px;
}

header a {
    color: #e30613;
    text-decoration: none;
    font-weight: bold;
}

main {
    max-width: 950px;
    margin: 40px auto;
    padding: 20px;
}

h1 {
    color: #e30613;
}

.contenedor {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.panel {
    background: white;
    border-radius: 12px;
    padding: 25px;
    box-shadow: 0 3px 12px #00000012;
}

label {
    display: block;
    margin: 17px 0 7px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

button {
    width: 100%;
    background: #e30613;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
    margin-top: 25px;
}

button:hover {
    background: #b80010;
}

.producto {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
    gap: 12px;
}

.total {
    color: #e30613;
    font-size: 26px;
    font-weight: bold;
    text-align: right;
}

.error {
    color: #b80010;
    font-weight: bold;
}

@media(max-width: 700px) {
    .contenedor {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <a href="/">
        <img src="/img/logo.png" alt="MENOSS">
    </a>
    <a href="/carrito">← Volver al carrito</a>
</header>

<main>
    <h1>Confirmar mi pedido</h1>

    <div class="contenedor">

        <section class="panel">
            <h2>Datos de entrega</h2>

            <p class="error"
               th:if="${error != null}"
               th:text="${error}">
            </p>

            <form action="/pedido/confirmar"
                  method="post"
                  id="formPedido">

                <label for="nombre">
                    Nombre del destinatario
                </label>
                <input type="text"
                       id="nombre"
                       name="nombre"
                       required>

                <label for="direccion">
                    Dirección de entrega
                </label>
                <input type="text"
                       id="direccion"
                       name="direccion"
                       placeholder="Av. Principal 123"
                       required>

                <label for="distrito">
                    Distrito
                </label>
                <input type="text"
                       id="distrito"
                       name="distrito"
                       required>

                <label for="telefono">
                    Teléfono
                </label>
                <input type="tel"
                       id="telefono"
                       name="telefono"
                       pattern="[0-9]{9}"
                       maxlength="9"
                       required>

                <input type="hidden"
                       id="resumen"
                       name="resumen">

                <button type="submit"
                        id="confirmarPedido">
                    Confirmar pedido
                </button>
            </form>
        </section>

        <section class="panel">
            <h2>Resumen de compra</h2>

            <div id="productosPedido"></div>

            <p class="total" id="totalPedido">
                S/ 0.00
            </p>

            <p id="mensajeCarrito"
               class="error"
               role="alert"></p>
        </section>

    </div>
</main>

<script>
const productos = [
    {id: 1, nombre: "Arroz 1 kg", precio: 4.50},
    {id: 2, nombre: "Aceite vegetal 1 L", precio: 8.90},
    {id: 3, nombre: "Leche evaporada", precio: 4.20},
    {id: 4, nombre: "Fideos 500 g", precio: 3.50},
    {id: 5, nombre: "Jabón de tocador", precio: 2.50},
    {id: 6, nombre: "Pasta dental", precio: 5.90},
    {id: 7, nombre: "Detergente 1 kg", precio: 9.50},
    {id: 8, nombre: "Lavavajillas", precio: 4.90},
    {id: 9, nombre: "Limpiador multiusos", precio: 7.50}
];

function obtenerCarrito() {
    try {
        const datos = JSON.parse(
            localStorage.getItem("menossCarrito") || "[]"
        );
        return Array.isArray(datos) ? datos : [];
    } catch (error) {
        return [];
    }
}

function mostrarResumen() {
    const carrito = obtenerCarrito();
    const contenedor =
        document.getElementById("productosPedido");

    contenedor.innerHTML = "";

    let total = 0;
    let resumen = [];

    carrito.forEach(item => {
        const producto = productos.find(
            p => p.id === item.id
        );

        if (!producto ||
            !Number.isInteger(item.cantidad) ||
            item.cantidad < 1) {
            return;
        }

        const subtotal =
            producto.precio * item.cantidad;

        total += subtotal;

        const fila = document.createElement("div");
        fila.className = "producto";

        const nombre = document.createElement("span");
        nombre.textContent =
            producto.nombre + " x" + item.cantidad;

        const precio = document.createElement("span");
        precio.textContent =
            "S/ " + subtotal.toFixed(2);

        fila.append(nombre, precio);
        contenedor.appendChild(fila);

        resumen.push(
            producto.nombre + " x" + item.cantidad +
            " = S/ " + subtotal.toFixed(2)
        );
    });

    document.getElementById(
        "totalPedido"
    ).textContent = "S/ " + total.toFixed(2);

    document.getElementById(
        "resumen"
    ).value = resumen.join(" | ") +
        " | TOTAL: S/ " + total.toFixed(2);

    const vacio = resumen.length === 0;

    document.getElementById(
        "confirmarPedido"
    ).disabled = vacio;

    document.getElementById(
        "mensajeCarrito"
    ).textContent = vacio
        ? "Tu carrito está vacío. Agrega productos primero."
        : "";
}

document.getElementById(
    "formPedido"
).addEventListener("submit", function() {
    // Se limpia después de confirmar en la siguiente página.
});

mostrarResumen();
</script>

</body>
</html>
