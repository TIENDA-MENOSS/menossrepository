
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Iniciar sesión | MENOSS</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

header {
    background: white;
    padding: 15px 8%;
    box-shadow: 0 2px 8px #00000015;
}

header img {
    width: 145px;
}

.contenedor {
    max-width: 430px;
    margin: 60px auto;
    background: white;
    padding: 35px;
    border-radius: 14px;
    box-shadow: 0 4px 20px #00000012;
}

h1 {
    text-align: center;
    color: #e30613;
}

.descripcion {
    text-align: center;
    color: #666;
}

label {
    display: block;
    margin: 18px 0 7px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

button {
    width: 100%;
    background: #e30613;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 25px;
}

button:hover {
    background: #b80010;
}

.mensaje {
    margin-top: 20px;
    padding: 12px;
    background: #ffe4e4;
    color: #a80010;
    border-radius: 7px;
    text-align: center;
}

.enlace {
    display: block;
    margin-top: 20px;
    text-align: center;
    color: #e30613;
    text-decoration: none;
}

@media (max-width: 500px) {
    .contenedor {
        margin: 25px 15px;
        padding: 25px;
    }
}
</style>
</head>

<body>

<header>
    <a href="/">
        <img src="/img/logo.png" alt="MENOSS">
    </a>
</header>

<main class="contenedor">

    <h1>Iniciar sesión</h1>

    <p class="descripcion">
        Bienvenido nuevamente a MENOSS
    </p>

    <form action="/login" method="post">

        <label for="correo">
            Correo electrónico
        </label>

        <input
            type="email"
            id="correo"
            name="correo"
            placeholder="ejemplo@gmail.com"
            required>

        <label for="password">
            Contraseña
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Ingresa tu contraseña"
            required>

        <button type="submit" id="iniciarSesion">
            Iniciar sesión
        </button>

    </form>

    <div
        id="mensaje"
        class="mensaje"
        role="alert"
        th:if="${mensaje != null}"
        th:text="${mensaje}">
    </div>

    <p class="descripcion">
        ¿Todavía no tienes una cuenta?
    </p>

    <a href="/registro" class="enlace">
        Crear una cuenta
    </a>

    <a href="/" class="enlace">
        ← Volver al inicio
    </a>

</main>

</body>
</html>
